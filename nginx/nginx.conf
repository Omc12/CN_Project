worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ==========================================
    # Upstream Backend Server Pool (Load Balancer)
    # ==========================================
    # Replace BACKEND_A_IP and BACKEND_B_IP with local Mac LAN IPs:
    # - Backend A (Mac 3): port 3001
    # - Backend B (Mac 4): port 3002
    # max_fails and fail_timeout enable passive health check & automatic failover
    upstream backend_servers {
        server BACKEND_A_IP:3001 max_fails=1 fail_timeout=5s;
        server BACKEND_B_IP:3002 max_fails=1 fail_timeout=5s;
    }

    # ==========================================
    # HTTP Server (Port 80) -> HTTPS 301 Redirect
    # (Note: Use port 8080 if running without sudo)
    # ==========================================
    server {
        listen 80;
        server_name app.teamX.test api.teamX.test;

        # Permanent redirect to HTTPS preserving host and request URI
        return 301 https://$host$request_uri;
    }

    # ==========================================
    # HTTPS Reverse Proxy & Load Balancer (Port 443)
    # (Note: Use port 8443 if running without sudo)
    # ==========================================
    server {
        listen 443 ssl;
        server_name app.teamX.test api.teamX.test;

        # SSL Certificates
        # Generate using OpenSSL (refer to README.md) and update paths accordingly:
        # e.g., certs/teamX.crt or /Users/<username>/nginx-certs/teamX.crt
        ssl_certificate     certs/teamX.crt;
        ssl_certificate_key certs/teamX.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend_servers;

            # Forward client headers to backends
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High-availability failover: retry next backend if one is down
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }
    }
}
